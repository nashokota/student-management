<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <h2>Student Management System</h2>
        <div class="user-info">
            <span>Welcome, <strong sec:authentication="name">Student</strong> (Student)</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </div>

    <!-- Content -->
    <div class="container">
        <h1 class="page-title">Student Dashboard - View All Students</h1>

        <div class="card">
            <h3>Student List</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Year</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="student, iter : ${students}">
                            <td th:text="${iter.index + 1}"></td>
                            <td th:text="${student.firstName}"></td>
                            <td th:text="${student.lastName}"></td>
                            <td th:text="${student.email}"></td>
                            <td th:text="${student.department}"></td>
                            <td th:text="${student.year}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="6" style="text-align: center; padding: 30px; color: #888;">
                                No students found.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
