<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <h2>Student Management System</h2>
        <div class="user-info">
            <span>Welcome, <strong sec:authentication="name">Teacher</strong> (Teacher)</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </div>

    <!-- Content -->
    <div class="container">
        <h1 class="page-title">Teacher Dashboard - Manage Students</h1>

        <!-- Success Message -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <!-- Add Student Form -->
        <div class="card">
            <h3>Add New Student</h3>
            <form th:action="@{/teacher/add-student}" th:object="${newStudent}" method="post" class="add-form">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}" placeholder="Enter first name">
                    <p class="error-text" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}" placeholder="Enter last name">
                    <p class="error-text" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="Enter email address">
                    <p class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" th:field="*{department}" placeholder="Enter department">
                    <p class="error-text" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></p>
                </div>
                <div class="form-group">
                    <label for="year">Year</label>
                    <select id="year" th:field="*{year}">
                        <option value="">Select Year</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                    <p class="error-text" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></p>
                </div>
                <div class="form-group full-width">
                    <button type="submit" class="btn btn-add">Add Student</button>
                </div>
            </form>
        </div>

        <!-- Student List -->
        <div class="card">
            <h3>All Students</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="student, iter : ${students}">
                            <td th:text="${iter.index + 1}"></td>
                            <td th:text="${student.firstName}"></td>
                            <td th:text="${student.lastName}"></td>
                            <td th:text="${student.email}"></td>
                            <td th:text="${student.department}"></td>
                            <td th:text="${student.year}"></td>
                            <td>
                                <a th:href="@{/teacher/edit-student/{id}(id=${student.id})}"
                                   class="btn btn-edit">Edit</a>
                                <a th:href="@{/teacher/delete-student/{id}(id=${student.id})}"
                                   class="btn btn-delete"
                                   onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="7" style="text-align: center; padding: 30px; color: #888;">
                                No students found. Add one above!
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
