<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Student Management</h2>
            <p class="subtitle">Sign in to continue</p>

            <!-- Error Message -->
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password. Please try again.
            </div>

            <!-- Logout Message -->
            <div th:if="${param.logout}" class="alert alert-info">
                You have been logged out successfully.
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <!-- Default Credentials -->
            <div class="credentials-box">
                <h4>Default Login Credentials:</h4>
                <p><strong>Teacher:</strong> username: <code>teacher</code> | password: <code>teacher123</code></p>
                <p><strong>Student:</strong> username: <code>student</code> | password: <code>student123</code></p>
            </div>
        </div>
    </div>
</body>
</html>
